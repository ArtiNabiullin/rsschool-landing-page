<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Coffee House</title>
  </head>
  <body>
    <header class="header">
      <div class="header-menu">
        <img class="header-logo" src="img/logo.png" alt="Coffee House Logo" />
        <div class="header-navigation">
          <ul class="header__list">
            <li class="header__item">
              <a href="catalog.html" class="header__link">favorite coffee</a>
            </li>
            <li class="header__item">
              <a href="#about" class="header__link">about</a>
            </li>
            <li class="header__item">
              <a href="#mobile" class="header__link">mobile app</a>
            </li>
            <li class="header__item">
              <a href="#contacts" class="header__link">contact us</a>
            </li>
          </ul>
        </div>
        <div class="header-actions">
          <div class="theme-witch">
            <button type="button" class="theme__light"></button>
            <button type="button" class="theme__dark"></button>
          </div>
          <div class="coffee-menu">
            <span class="coffee-menu__text">menu</span>
            <img class="coffee-menu__icon" src="img/menu.svg" alt="Menu Icon" />
          </div>
        </div>
      </div>
    </header>
    <main class="main"></main>
    <footer class="footer"></footer>
  </body>
  <script src="index.js"></script>
</html>
